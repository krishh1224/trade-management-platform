spring.application.name=trade-api
mybatis.mapper-locations=classpath:mapper/*.xml

# spring-dotenv (on the classpath) namespaces .env keys under "env." by default
# (e.g. env.JWT_SECRET); this repo's placeholders use bare names (${JWT_SECRET}),
# so strip the prefix to let a local .env file resolve them directly.
.env.prefix=

auth.jwt.algorithm=${AUTH_JWT_ALGORITHM:HS256}
auth.jwt.clock-skew=${AUTH_JWT_CLOCK_SKEW:0s}

spring.profiles.default=local
