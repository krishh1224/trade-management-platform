server.port=${SERVER_PORT:8081}

# Database - PostgreSQL in Docker on EC2 machine 
# Note: Using 'trading_platform' database to match executor/docker-compose setup
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trade_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:n3u3d4!}

# Local development only. Prefer JWT_SECRET when set so the real auth service and
# Trade API can share one verifier secret outside Docker as well.
auth.jwt.shared-secret=${JWT_SECRET:local-dev-only-jwt-secret-minimum-32-bytes-000001}
# Auth stub (can be disabled for local testing by using a stub token)
auth.stub.base-url=${AUTH_STUB_BASE_URL:http://localhost:8100}

# Kafka - in Docker on EC2 machine 
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:}
