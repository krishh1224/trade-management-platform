server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trade_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Local development only. The platform profile has no default and refuses to start without JWT_SECRET.
auth.jwt.shared-secret=${JWT_SECRET:local-dev-only-trade-api-jwt-secret-not-for-production-use-000001}
auth.stub.base-url=${AUTH_STUB_BASE_URL:http://localhost:8082}
