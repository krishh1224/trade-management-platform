server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:trade_management}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:n3u3d4!}

# Empty default on purpose: an unresolved ${JWT_SECRET} would bind as literal text, not fail.
auth.jwt.shared-secret=${JWT_SECRET:}
auth.stub.base-url=http://${AUTH_STUB_HOST:auth-stub}:8082

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
