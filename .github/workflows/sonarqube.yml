name: SonarQube Quality Gate

on:
  push:
    branches:
      - "**"

jobs:

  # ============================================================
  # 1. ORDER SERVICE - Spring Boot
  # ============================================================
  order-service:
    name: SonarQube - Order Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: SonarQube Analysis + Quality Gate
        working-directory: services/order-service
        run: |
          mvn sonar:sonar \
            "-Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}" \
            "-Dsonar.token=${{ secrets.SONAR_TOKEN }}" \
            "-Dsonar.qualitygate.wait=true"


  # ============================================================
  # 2. EXECUTOR SERVICE - Spring Boot
  # ============================================================
  executor-service:
    name: SonarQube - Executor Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: SonarQube Analysis + Quality Gate
        working-directory: services/executor-service
        run: |
          mvn sonar:sonar \
            "-Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}" \
            "-Dsonar.token=${{ secrets.SONAR_TOKEN }}" \
            "-Dsonar.qualitygate.wait=true"


  # ============================================================
  # 3. AUTH SERVICE - NestJS
  # ============================================================
  auth-service:
    name: SonarQube - Auth Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        working-directory: services/auth-service
        run: npm ci

      - name: Run tests with coverage
        working-directory: services/auth-service
        run: npm test -- --coverage

      - name: Verify LCOV report
        working-directory: services/auth-service
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "ERROR: coverage/lcov.info was not generated"
            exit 1
          fi

          echo "LCOV report found:"
          ls -lh coverage/lcov.info

      - name: Install SonarScanner
        run: npm install -g sonarqube-scanner

      - name: Run SonarQube Scanner + Quality Gate
        working-directory: services/auth-service
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true


  # ============================================================
  # 4. PYTHON - Trade ETL
  # ============================================================
  trade-etl:
    name: SonarQube - Trade ETL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ETL/trade_etl
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        working-directory: ETL/trade_etl
        run: |
          pytest --cov=. --cov-report=xml

      - name: Verify coverage report
        working-directory: ETL/trade_etl
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi

          echo "Coverage report found:"
          ls -lh coverage.xml

      - name: Install SonarScanner
        run: npm install -g sonarqube-scanner

      - name: Run SonarQube Scanner + Quality Gate
        working-directory: ETL/trade_etl
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true


  # ============================================================
  # 5. ANGULAR - Trade UI
  # ============================================================
  trade-ui:
    name: SonarQube - Trade UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/trade-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/trade-ui
        run: npm ci

      - name: Run Angular tests with coverage
        working-directory: frontend/trade-ui
        run: |
          npx ng test \
            --coverage \
            --coverage-reporters=html \
            --coverage-reporters=lcov \
            --watch=false

      - name: Verify LCOV report
        working-directory: frontend/trade-ui
        run: |
          if [ ! -f coverage/trade-ui/lcov.info ]; then
            echo "ERROR: coverage/trade-ui/lcov.info was not generated"
            echo "Searching for LCOV files..."
            find coverage -name "lcov.info" -type f || true
            exit 1
          fi

          echo "LCOV report found:"
          ls -lh coverage/trade-ui/lcov.info

      - name: Install SonarScanner
        run: npm install -g sonarqube-scanner

      - name: Run SonarQube Scanner + Quality Gate
        working-directory: frontend/trade-ui
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true