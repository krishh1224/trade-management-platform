services:
  # ============== KAFKA ==============
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-sprint7
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:8085,DOCKER://kafka:29092,CONTROLLER://kafka:9093
      # KAFKA_ADVERTISED_LISTENERS: tells external clients what address to use to connect back to Kafka
      # HOST: external address (for clients outside Docker, e.g., on Windows machine)
      # DOCKER: internal address (for containers in the same Docker network)
      KAFKA_ADVERTISED_LISTENERS: HOST://${KAFKA_HOST:-10.8.64.174}:8085,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "8085:8085"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - trading-net

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: trading-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - trading-net
    profiles: ["platform"]

  # ============== POSTGRESQL ==============
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./databases/postgresql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./databases/postgresql/migrations/V2_add_settlement_columns.sql:/docker-entrypoint-initdb.d/02_migration_v2.sql:ro
      - ./databases/postgresql/migrations/V3_add_credentials.sql:/docker-entrypoint-initdb.d/03_migration_v3.sql:ro
      - ./databases/postgresql/migrations/V4_add_refresh_tokens.sql:/docker-entrypoint-initdb.d/04_migration_v4.sql:ro
      - ./databases/postgresql/migrations/V5_add_roles_to_credentials.sql:/docker-entrypoint-initdb.d/05_migration_v5.sql:ro
      - ./databases/postgresql/migrations/V6_add_external_order_id.sql:/docker-entrypoint-initdb.d/06_migration_v6.sql:ro
      - ./databases/postgresql/migrations/V7_add_watchlists.sql:/docker-entrypoint-initdb.d/07_migration_v7.sql:ro
      - ./databases/postgresql/migrations/V8_watchlist_groups.sql:/docker-entrypoint-initdb.d/08_migration_v8.sql:ro
      - ./databases/postgresql/migrations/V9_market_quote_snapshots.sql:/docker-entrypoint-initdb.d/09_migration_v9.sql:ro
      - ./databases/postgresql/migrations/V10_multi_exchange_and_fx.sql:/docker-entrypoint-initdb.d/10_migration_v10.sql:ro
      - ./databases/postgresql/migrations/V11_add_preferences.sql:/docker-entrypoint-initdb.d/11_migration_v11.sql:ro
      - ./databases/postgresql/migrations/V12_alert_channel_enum.sql:/docker-entrypoint-initdb.d/12_migration_v12.sql:ro
      - ./databases/postgresql/migrations/V13_notifications.sql:/docker-entrypoint-initdb.d/13_migration_v13.sql:ro
      - ./databases/postgresql/migrations/V14_push_subscriptions.sql:/docker-entrypoint-initdb.d/14_migration_v14.sql:ro
      - ./databases/postgresql/seed-data.sql:/docker-entrypoint-initdb.d/99_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trade_management}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trading-net

  # ============== NEST AUTH (SPRINT 8) ==============
  # Replaced legacy auth-stub with NestJS implementation
  nest-auth:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: nest-auth
    profiles: ["platform"]
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a secret of at least 32 bytes}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trade_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trading-net

  # ============== TRADE API (PRODUCER) ==============
  trade-api:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    container_name: trade-api
    profiles: ["platform"]
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: platform
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trade_management}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a secret of at least 32 bytes}
      # automated strategies sign their order tokens with this; unset = strategies cannot place orders
      STRATEGY_TOKEN_SECRET: ${STRATEGY_TOKEN_SECRET:-}
      AUTH_STUB_BASE_URL: http://nest-auth:3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      nest-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - trading-net

  # ============== EXECUTOR (CONSUMER) ==============
  executor:
    build:
      context: .
      dockerfile: ./services/executor-service/Dockerfile
    container_name: executor
    profiles: ["platform"]
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: platform
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trade_management}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FAUXNANCE_BASE_URL: http://trade-api:8081
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      trade-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - trading-net

networks:
  trading-net:
    name: trading-net
    driver: bridge

volumes:
  pgdata:
    name: pgdata
  kafka-data:
    name: kafka-data
