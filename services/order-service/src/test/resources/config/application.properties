# Test-only overrides, loaded on top of src/main/resources/application.properties.
# The .env file points at a shared Kafka broker and a real database: a context-loading test must
# not join the notifications or watchlists consumer group or dispatch real rows.
notifications.consumer.auto-startup=false
watchlists.consumer.auto-startup=false
strategies.consumer.auto-startup=false
auth.strategy-token.shared-secret=test-only-strategy-token-secret-at-least-32-bytes
notifications.dispatcher.enabled=false
notifications.email.enabled=false
notifications.push.enabled=false
