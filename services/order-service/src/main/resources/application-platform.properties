server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Empty default on purpose: an unresolved ${JWT_SECRET} would bind as literal text, not fail.
auth.jwt.shared-secret=${JWT_SECRET}
auth.stub.base-url=http://${AUTH_STUB_HOST}:${AUTH_STUB_PORT}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
