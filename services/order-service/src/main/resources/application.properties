spring.application.name=trade-api
mybatis.mapper-locations=classpath:mapper/*.xml

# Load .env file using spring-dotenv
spring.config.import=optional:dotenv:.env,optional:dotenv:manifest.env
# spring-dotenv namespaces .env keys under "env." by default (e.g. env.JWT_SECRET);
# this repo's placeholders use bare names (${JWT_SECRET}), so strip the prefix.
.env.prefix=

auth.jwt.algorithm=${AUTH_JWT_ALGORITHM:HS256}
auth.jwt.clock-skew=${AUTH_JWT_CLOCK_SKEW:0s}

# Fauxnance market data for the portfolio module. Put FAUXNANCE_API_KEY in .env; without it
# pricing is simply unavailable and every portfolio route answers from fallbacks or 503.
fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
fauxnance.api-key=${FAUXNANCE_API_KEY:}
fauxnance.cache-ttl=60s
fauxnance.connect-timeout=2s
fauxnance.read-timeout=4s
fauxnance.usage-cache-ttl=5m
fauxnance.candle-cache-ttl=1h

spring.profiles.default=local

# Notifications module (com.team5.notifications) - see src/main/java/com/team5/notifications/README.md
notifications.consumer.group-id=notifications
notifications.consumer.auto-startup=true
notifications.dispatcher.enabled=true
notifications.dispatcher.interval-ms=5000
notifications.dispatcher.batch-size=50

# Notifications EMAIL channel. Off by default (logging stub); set NOTIFICATIONS_EMAIL_ENABLED=true and
# the MAIL_* variables in .env to send real email. Never put the password in this file.
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
notifications.email.from=${MAIL_FROM:${MAIL_USERNAME:}}
notifications.email.inbox-url=${NOTIFICATIONS_INBOX_URL:http://localhost:4200/notifications}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# a slow or unreachable provider must not hold up the dispatcher
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Notifications PUSH channel (browser Web Push). Off by default (logging stub); set
# NOTIFICATIONS_PUSH_ENABLED=true and the PUSH_VAPID_* keys in .env to show real browser pop-ups.
# The private key never goes in this file.
notifications.push.enabled=${NOTIFICATIONS_PUSH_ENABLED:false}
notifications.push.vapid-public-key=${PUSH_VAPID_PUBLIC_KEY:}
notifications.push.vapid-private-key=${PUSH_VAPID_PRIVATE_KEY:}
notifications.push.subject=${PUSH_VAPID_SUBJECT:mailto:notifications@artha.example}
notifications.push.ttl-seconds=86400
