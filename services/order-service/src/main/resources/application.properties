spring.application.name=trade-api
mybatis.mapper-locations=classpath:mapper/*.xml

# Load .env file using spring-dotenv
spring.config.import=optional:dotenv:.env,optional:dotenv:manifest.env
# spring-dotenv namespaces .env keys under "env." by default (e.g. env.JWT_SECRET);
# this repo's placeholders use bare names (${JWT_SECRET}), so strip the prefix.
.env.prefix=

auth.jwt.algorithm=${AUTH_JWT_ALGORITHM:HS256}
auth.jwt.clock-skew=${AUTH_JWT_CLOCK_SKEW:0s}

# Fauxnance market data for the portfolio module. Put FAUXNANCE_API_KEY in .env; without it
# pricing is simply unavailable and every portfolio route answers from fallbacks or 503.
fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
fauxnance.api-key=${FAUXNANCE_API_KEY:}
fauxnance.cache-ttl=60s
fauxnance.connect-timeout=2s
fauxnance.read-timeout=4s
fauxnance.usage-cache-ttl=5m
fauxnance.candle-cache-ttl=1h

spring.profiles.default=local

# Notifications module (com.team5.notifications) - see src/main/java/com/team5/notifications/README.md
notifications.consumer.group-id=notifications
notifications.consumer.auto-startup=true
notifications.dispatcher.enabled=true
notifications.dispatcher.interval-ms=5000
notifications.dispatcher.batch-size=50

# Watchlists module (com.team5.watchlists) - see src/main/java/com/team5/watchlists/README.md
# Its own consumer group on market-data; it reads no other topic.
watchlists.consumer.group-id=watchlists-market-data
watchlists.consumer.auto-startup=true
# ACTIVE price alerts one account may hold at once; creating one more is VAL-422
watchlists.alerts.max-active-per-account=20

# Strategies module (com.team5.strategies) - see src/main/java/com/team5/strategies/README.md
# Its own consumer group on market-data; it places orders only through POST /api/v1/orders.
strategies.consumer.group-id=strategies-market-data
strategies.consumer.auto-startup=true
# strategies one account may hold, in any status
strategies.max-per-account=10
# BUY limit = ask x (1 + tolerance), SELL limit = bid x (1 - tolerance)
strategies.price-tolerance=0.01
# pause between a rule firing and the order decision; 0s except in a live demonstration
strategies.decision-delay=${STRATEGIES_DECISION_DELAY:0s}
# a quote older than this when consumed (a backlog after downtime) is kept for history, never traded on
strategies.max-quote-age=5m
# the Trade API's own order route, reached over HTTP from inside this service
strategies.trade-api-base-url=${STRATEGIES_TRADE_API_BASE_URL:http://localhost:${server.port:8081}}
strategies.connect-timeout=2s
strategies.read-timeout=5s
# The key a strategy's delegated order token is signed with: its own, never JWT_SECRET. Without it the
# Trade API accepts no strategy tokens and every strategy order fails closed (see the module README).
auth.strategy-token.shared-secret=${STRATEGY_TOKEN_SECRET:}
auth.strategy-token.ttl=60s

# Notifications EMAIL channel. Off by default (logging stub); set NOTIFICATIONS_EMAIL_ENABLED=true and
# the MAIL_* variables in .env to send real email. Never put the password in this file.
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
notifications.email.from=${MAIL_FROM:${MAIL_USERNAME:}}
notifications.email.inbox-url=${NOTIFICATIONS_INBOX_URL:http://localhost:4200/notifications}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# a slow or unreachable provider must not hold up the dispatcher
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Notifications PUSH channel (browser Web Push). Off by default (logging stub); set
# NOTIFICATIONS_PUSH_ENABLED=true and the PUSH_VAPID_* keys in .env to show real browser pop-ups.
# The private key never goes in this file.
notifications.push.enabled=${NOTIFICATIONS_PUSH_ENABLED:false}
notifications.push.vapid-public-key=${PUSH_VAPID_PUBLIC_KEY:}
notifications.push.vapid-private-key=${PUSH_VAPID_PRIVATE_KEY:}
notifications.push.subject=${PUSH_VAPID_SUBJECT:mailto:notifications@artha.example}
notifications.push.ttl-seconds=86400

# Advisor module (com.team5.advisor): the Gemini chat assistant, see src/main/java/com/team5/advisor/README.md.
# Put GEMINI_API_KEY (and optionally GEMINI_MODEL) in .env. Without a key the service still starts and the chat
# answers ADV-503. Note the 1.1.x property names: the model settings sit under `chat.options`.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.temperature=0.3
spring.ai.google.genai.chat.options.max-output-tokens=2048
# Give up on a Gemini call that gets no answer (it can stall under load) instead of waiting forever.
advisor.gemini.request-timeout=40s
# Fail fast on the free tier's rate limit instead of retrying for minutes; the API returns ADV-429.
spring.ai.retry.max-attempts=2
