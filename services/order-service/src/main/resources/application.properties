spring.application.name=trade-api
mybatis.mapper-locations=classpath:mapper/*.xml

# Load .env file using spring-dotenv
spring.config.import=optional:dotenv:.env,optional:dotenv:manifest.env
# spring-dotenv namespaces .env keys under "env." by default (e.g. env.JWT_SECRET);
# this repo's placeholders use bare names (${JWT_SECRET}), so strip the prefix.
.env.prefix=

auth.jwt.algorithm=${AUTH_JWT_ALGORITHM:HS256}
auth.jwt.clock-skew=${AUTH_JWT_CLOCK_SKEW:0s}

# Fauxnance market data for the portfolio module. Put FAUXNANCE_API_KEY in .env; without it
# pricing is simply unavailable and every portfolio route answers from fallbacks or 503.
fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
fauxnance.api-key=${FAUXNANCE_API_KEY:}
fauxnance.cache-ttl=60s
fauxnance.connect-timeout=2s
fauxnance.read-timeout=4s
fauxnance.usage-cache-ttl=5m
fauxnance.candle-cache-ttl=1h

spring.profiles.default=local
