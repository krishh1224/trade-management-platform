openapi: 3.1.0

info:
  title: Customer Notifications API
  version: 1.0.0
  summary: Notification history for a customer's own account, served by the Trade REST API.
  description: |
    The notifications module lives inside the Trade REST API (`com.team5.notifications`). It turns
    `ORDER_FILLED`, `ORDER_REJECTED` and `ORDER_CANCELLED` events from the `trade-events` topic,
    price alerts raised by watchlists, and order-history export emails, into messages delivered on
    the channel the customer holds in
    Customer Preferences. This contract covers the routes a customer can reach. Everything else the
    module does is driven by Kafka or by an in-process Java call.

    ## What is deliberately not a route

    Watchlists hands a triggered alert to this module through the Java interface
    `com.team5.notifications.api.AlertDelivery`. There is no HTTP route for creating or sending a
    notification. A route would let a customer send themselves, or anyone, arbitrary content. The
    only way a notification comes into existence is a `trade-events` message or an in-process call
    from another module of the Trade REST API.

    Likewise there is no field anywhere in this API, or in Customer Preferences, that names a
    destination (webhook URL, callback, address). The destination is fixed per channel type on the
    server, so the platform never posts to a location a caller chose.

    ## Delivery lifecycle

    Consuming an event and delivering it are separate. A notification is written as `QUEUED` and
    the Kafka offset is committed once that row is durable. A dispatcher then resolves the channel
    from Customer Preferences, on every send, and moves the row on:

    | Status | Meaning |
    |---|---|
    | `QUEUED` | Recorded, waiting for the dispatcher |
    | `HELD` | No preference has been stored for the account yet. Held, not lost: it is sent on the next dispatcher pass after a preference exists |
    | `SENT` | Handed to the resolved channel. `channel` records which one |
    | `FAILED` | The resolved channel refused it. `channel` records which one |
    | `SKIPPED` | The customer's stored preference is `NONE`. Visible here, not sent outbound |

    ## Idempotency

    Every notification carries the `eventId` of the Kafka envelope (or the `alertId` of a watchlist
    alert) under a unique constraint. A replayed event inserts nothing and sends nothing.

    ## Authentication and access

    Every route requires a valid signed JWT, verified by the Trade REST API before any route runs. A
    missing, malformed, expired or wrongly signed token is `AUTH-401`, 401. A valid token whose
    `accountId` claim does not match `{id}` is `ACC-403`, 403. A notification id that does not
    belong to `{id}` is `NTF-404`, 404, whether or not it exists for another account, so the
    response never confirms that someone else's notification exists.
  contact:
    name: Team 5
  license:
    name: Instructional use only

servers:
  - url: http://localhost:8080
    description: Local development, run from Docker Compose
  - url: http://trade-api:8080
    description: Service name inside the Docker Compose network

tags:
  - name: Notifications
    description: A customer's notification history, shown in the Angular inbox.

security:
  - bearerAuth: []

paths:
  /api/v1/accounts/{id}/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the account's notifications, newest first.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - name: status
          in: query
          required: false
          description: Only return notifications in this delivery status.
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: limit
          in: query
          required: false
          description: Maximum number of notifications to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: The account's notifications, newest first. Empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /api/v1/accounts/{id}/notifications/{notificationId}:
    get:
      tags: [Notifications]
      operationId: getNotification
      summary: Read one notification belonging to the account.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - $ref: '#/components/parameters/NotificationIdPath'
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotificationNotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /api/v1/accounts/{id}/notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read in the inbox.
      description: |
        Idempotent. Marking an already-read notification keeps its original `readAt`. This is the
        inbox's own read state, not a read receipt from an outbound provider.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - $ref: '#/components/parameters/NotificationIdPath'
      responses:
        '200':
          description: The notification, with `readAt` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotificationNotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'

  /api/v1/accounts/{id}/push-subscription/config:
    get:
      tags: [Notifications]
      operationId: getPushConfig
      summary: What this browser needs to subscribe to push notifications.
      description: |
        `publicKey` is the platform's VAPID public key (not a secret), base64url. `enabled` is false
        and `publicKey` null when browser push is switched off on the server.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Push configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{id}/push-subscription:
    put:
      tags: [Notifications]
      operationId: savePushSubscription
      summary: Register this browser for push notifications.
      description: |
        The body is the browser's `PushSubscription.toJSON()`. The platform later POSTs to `endpoint`,
        so it is accepted only for `https` URLs on the browser vendors' push services
        (`fcm.googleapis.com`, `*.notify.windows.com`, `updates.push.services.mozilla.com`,
        `web.push.apple.com`) on the default port with no credentials. Anything else is `VAL-422`.
        Re-registering the same browser, for this or another account, moves it to this account.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
      responses:
        '204':
          description: This browser now receives push notifications for the account.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'
    delete:
      tags: [Notifications]
      operationId: deletePushSubscription
      summary: Stop push notifications on this browser.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - name: endpoint
          in: query
          required: true
          description: The browser subscription's endpoint, as registered.
          schema:
            type: string
            maxLength: 1000
      responses:
        '204':
          description: Removed (also when this account had no such browser).
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT issued by the auth service. The claims contract is defined in `auth-api.yaml`.

  parameters:
    AccountIdPath:
      name: id
      in: path
      required: true
      description: The numeric account key, `ACCOUNTS.id`. Must equal the token's `accountId` claim.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      description: The notification's key.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 42

  responses:
    Unauthorised:
      description: Missing, malformed, expired or wrongly signed token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorised:
              value:
                errorCode: AUTH-401
                message: Unauthorised
    Forbidden:
      description: The token's `accountId` claim does not match the account in the path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                errorCode: ACC-403
                message: Account not active
    NotificationNotFound:
      description: No notification with that id belongs to this account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                errorCode: NTF-404
                message: Notification not found
    InvalidInput:
      description: A path or query parameter failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                errorCode: VAL-422
                message: Invalid input

  schemas:
    NotificationStatus:
      type: string
      enum: [QUEUED, HELD, SENT, FAILED, SKIPPED]

    NotificationChannel:
      type: string
      enum: [EMAIL, PUSH, BROWSER, SMS, NONE]
      description: The channel resolved from Customer Preferences at send time.

    NotificationType:
      type: string
      enum: [ORDER_FILLED, ORDER_REJECTED, ORDER_CANCELLED, PRICE_ALERT, ORDER_HISTORY_EXPORT]

    NotificationResponse:
      type: object
      additionalProperties: false
      required: [notificationId, type, title, message, status, createdAt]
      properties:
        notificationId:
          type: integer
          format: int64
          example: 42
        type:
          $ref: '#/components/schemas/NotificationType'
        orderId:
          type: [string, 'null']
          format: uuid
          description: The order the notification is about. Null for a price alert.
        title:
          type: string
          example: Order rejected
        message:
          type: string
          description: |
            Plain text. Built by this module from structured fields only: symbol, side, quantity,
            price and a reason code. Never carries a credential, a name, an address or a card number.
          example: Your SELL order for 5 TSLA was rejected (insufficient holdings).
        status:
          $ref: '#/components/schemas/NotificationStatus'
        channel:
          oneOf:
            - $ref: '#/components/schemas/NotificationChannel'
            - type: 'null'
          description: The channel the dispatcher resolved. Null while `QUEUED` or `HELD`.
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: [string, 'null']
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time

    PushConfigResponse:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        publicKey:
          type: [string, 'null']
          description: VAPID public key, base64url (uncompressed P-256 point).

    PushSubscriptionRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 1000
          example: https://fcm.googleapis.com/fcm/send/abc123
        expirationTime:
          type: [number, 'null']
          description: Sent by some browsers; ignored.
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              description: The browser's P-256 public key, base64url (65 bytes).
            auth:
              type: string
              description: The browser's auth secret, base64url (16 bytes).

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      description: |
        The platform error envelope. This module reuses the platform catalogue and adds one code,
        `NTF-404`, because no existing not-found code describes a notification.
      properties:
        errorCode:
          type: string
          enum: [AUTH-401, ACC-403, NTF-404, VAL-422]
          description: |
            | Code | HTTP | Meaning |
            |---|---|---|
            | `AUTH-401` | 401 | Missing or invalid token |
            | `ACC-403` | 403 | Token does not reach this account |
            | `NTF-404` | 404 | Notification not found for this account (new in this module) |
            | `VAL-422` | 422 | Invalid path or query parameter |
        message:
          type: string
