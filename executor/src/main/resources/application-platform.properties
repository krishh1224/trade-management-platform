# Platform/Docker Deployment Profile
# Run executor in Docker alongside Kafka and PostgreSQL
# Requires POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, KAFKA_BOOTSTRAP_SERVERS env vars

server.port=${SERVER_PORT:8082}

# Database - use Docker service name
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:trade_management}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:n3u3d4!}

# Kafka - use Docker service name
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

# Consumer: Use custom KafkaEnvelopeDeserializer and manual acknowledgment
spring.kafka.consumer.group-id=trade-executor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.value-deserializer=com.neueda.learning.event.KafkaEnvelopeDeserializer
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.poll-timeout=3000

# Producer: Publish trade-events as JSON strings with acknowledgment from broker
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Retry and backoff configuration for transient failures
executor.retry.initial-interval-ms=100
executor.retry.max-interval-ms=5000
executor.retry.multiplier=2.0
executor.retry.max-attempts=3

# Trade API base URL - use Docker service name
fauxnance.base-url=${TRADE_API_HOST:http://trade-api:8081}

# Logging
logging.level.root=INFO
logging.level.com.neueda.learning=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
