# Local Development Profile
# Run executor locally on Windows, connect to Kafka and PostgreSQL on EC2 (10.8.64.174)
# Usage: java -Dspring.profiles.active=local -jar executor.jar

server.port=${SERVER_PORT:8082}

# Database - PostgreSQL on localhost (Windows local machine)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trade_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:n3u3d4!}

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# Kafka - in Docker on EC2 machine (10.8.64.174)
# EC2 Kafka exposes port 8085 for PLAINTEXT listener from external hosts
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:10.8.64.174:8085}
spring.kafka.consumer.group-id=trade-executor
spring.kafka.consumer.auto-offset-reset=earliest
# Use custom KafkaEnvelopeDeserializer to properly handle KafkaEnvelope<OrderPlacedPayload>
spring.kafka.consumer.value-deserializer=com.neueda.learning.event.KafkaEnvelopeDeserializer
spring.kafka.listener.poll-timeout=3000

# Trade API base URL - running locally on Windows
fauxnance.base-url=${FAUXNANCE_BASE_URL:http://localhost:8081}

# Logging
logging.level.root=INFO
logging.level.com.neueda.learning=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN

