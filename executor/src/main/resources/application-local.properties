# Local Development Profile
# Run executor locally on Windows, connect to Kafka and PostgreSQL on EC2 
# Usage: java -Dspring.profiles.active=local -jar executor.jar

server.port=${SERVER_PORT:8082}

# Database - PostgreSQL on localhost (Windows local machine)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trade_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# Kafka - in Docker on EC2 machine (10.8.67.91)
# EC2 Kafka exposes port 8085 for PLAINTEXT listener from external hosts
spring.kafka.bootstrap-servers=10.8.67.91:8085

# Consumer: Use ErrorHandlingDeserializer wrapping custom KafkaEnvelopeDeserializer
spring.kafka.consumer.group-id=trade-executor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=com.neueda.learning.event.KafkaEnvelopeDeserializer
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.poll-timeout=3000

# Producer: Publish trade-events as JSON strings with acknowledgment from broker
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Retry and backoff configuration for transient failures
executor.retry.initial-interval-ms=100
executor.retry.max-interval-ms=5000
executor.retry.multiplier=2.0
executor.retry.max-attempts=3

# Trade API base URL - running locally on Windows
fauxnance.base-url=${FAUXNANCE_BASE_URL:http://localhost:8081}

# Market Data Poller Configuration
# Poll interval in seconds (minimum 44s to stay within 2000 requests/day quota for 6 symbols)
# Quota math: ceil(6 / 25) * floor(86400 / 60) = 1 * 1440 = 1440 requests/day (within 2000)
market-data.poll-interval-seconds=${MARKET_DATA_POLL_INTERVAL_SECONDS:60}

# Logging
logging.level.root=INFO
logging.level.com.neueda.learning=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN

