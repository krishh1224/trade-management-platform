# Application
spring.application.name=executor
spring.profiles.default=local
server.port=8082

# Load .env file using spring-dotenv
spring.config.import=optional:dotenv:.env

# Database - PostgreSQL
# For Docker deployment: use "postgres:5432" (Docker service name)
# For localhost development: use "localhost:5432" 
spring.datasource.url=jdbc:postgresql://localhost:5432/trade_management
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# Kafka
# For Docker deployment: use KAFKA_BOOTSTRAP_SERVERS=kafka:29092 (Docker service name)
# For localhost development: use default localhost:8085 (Docker Kafka exposed port)
# To override: set environment variable KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:}

# Consumer configuration
spring.kafka.consumer.group-id=trade-executor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual_immediate
# Use ErrorHandlingDeserializer to wrap our custom KafkaEnvelopeDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=com.neueda.learning.event.KafkaEnvelopeDeserializer
# Important: Don't fail on deserialization errors at the container level
spring.kafka.listener.poll-timeout=3000

# Producer configuration: Publish trade-events as JSON strings
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Retry and backoff configuration for transient failures
# Applies to DefaultErrorHandler in KafkaConsumerConfig
executor.retry.initial-interval-ms=100
executor.retry.max-interval-ms=5000
executor.retry.multiplier=2.0
executor.retry.max-attempts=3

# Market Data Poller Configuration
# Poll interval in seconds (minimum 44s to stay within 2000 requests/day quota)
market-data.poll-interval-seconds=${MARKET_DATA_POLL_INTERVAL_SECONDS:60}

# Settlement configuration
settlement.optimistic-lock.max-retries=3

# Fauxnance Client
fauxnance.base-url=https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1
fauxnance.api-key=${FAUXNANCE_API_KEY}
fauxnance.quote.max-retries=3
fauxnance.quote.initial-backoff-ms=100
fauxnance.quote.max-backoff-ms=2000

# Logging
logging.level.root=INFO
logging.level.com.neueda.learning=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
