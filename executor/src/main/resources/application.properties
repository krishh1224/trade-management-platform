# Application
spring.application.name=executor
server.port=8082

# Database - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_platform
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:8085}
spring.kafka.consumer.group-id=trade-executor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=com.neueda.learning.event.OrderPlacedEvent:com.neueda.learning.event.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.neueda.learning.event
spring.kafka.consumer.properties.spring.json.default.type=com.neueda.learning.event.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.use.type.info.headers=false

# Fauxnance Client
fauxnance.base-url=http://localhost:8081
fauxnance.quote.max-retries=3
fauxnance.quote.initial-backoff-ms=100
fauxnance.quote.max-backoff-ms=2000

# Logging
logging.level.root=INFO
logging.level.com.neueda.learning=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
