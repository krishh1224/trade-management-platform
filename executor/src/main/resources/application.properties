# Application
spring.application.name=executor
spring.profiles.default=local
server.port=8082

# Database - PostgreSQL
# For Docker deployment: use "postgres:5432" (Docker service name)
# For localhost development: use "localhost:5432" 
spring.datasource.url=jdbc:postgresql://localhost:5432/trade_management
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:n3u3d4!}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# Kafka
# For Docker deployment: use KAFKA_BOOTSTRAP_SERVERS=kafka:29092 (Docker service name)
# For localhost development: use default localhost:8085 (Docker Kafka exposed port)
# To override: set environment variable KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:8085}
spring.kafka.consumer.group-id=trade-executor
spring.kafka.consumer.auto-offset-reset=earliest
# Use ErrorHandlingDeserializer to wrap the JsonDeserializer for better error handling
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Type mapping: When deserializing, look for type info in message headers under this key
# If not found, use the default type (KafkaEnvelope)
spring.kafka.consumer.properties.spring.json.type.mapping=KafkaEnvelope:com.neueda.learning.event.KafkaEnvelope
spring.kafka.consumer.properties.spring.json.trusted.packages=com.neueda.learning.event
spring.kafka.consumer.properties.spring.json.default.type=com.neueda.learning.event.KafkaEnvelope
spring.kafka.consumer.properties.spring.json.use.type.info.headers=false
# Error handling: log errors but don't fail the consumer
spring.kafka.consumer.properties.spring.deserializer.value.error.handler.class=org.springframework.kafka.support.serializer.LoggingErrorHandler
# Important: Don't fail on deserialization errors at the container level
spring.kafka.listener.poll-timeout=3000

# Fauxnance Client
fauxnance.base-url=http://localhost:8081
fauxnance.quote.max-retries=3
fauxnance.quote.initial-backoff-ms=100
fauxnance.quote.max-backoff-ms=2000

# Logging
logging.level.root=INFO
logging.level.com.neueda.learning=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
