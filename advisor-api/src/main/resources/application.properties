spring.application.name=advisor-api
server.port=${ADVISOR_PORT:8083}

# Secrets and local settings come from advisor-api/.env (git-ignored), read as a properties file.
spring.config.import=optional:file:.env[.properties]

# Shared trade_management database. Every connection is read-only: the advisor never writes.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trade_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=5

# Same JWT rules as trade-api: HS256 shared secret, issuer auth-service, accountId claim.
auth.jwt.shared-secret=${JWT_SECRET:}
auth.jwt.algorithm=${AUTH_JWT_ALGORITHM:HS256}
auth.jwt.issuer=${AUTH_JWT_ISSUER:auth-service}

# Gemini Developer API (free tier). Switch model with GEMINI_MODEL.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.temperature=0.3
spring.ai.google.genai.chat.max-output-tokens=2048

# Give up on a Gemini call that gets no answer (it can stall under load) instead of waiting forever.
advisor.gemini.request-timeout=40s

# Fail fast on the free tier's rate limit instead of retrying for minutes; the API returns ADV-429.
spring.ai.retry.max-attempts=2

logging.level.com.team5.advisor=INFO
